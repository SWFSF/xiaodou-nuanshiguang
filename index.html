<style>
/* 小豆暖食光 —— 样式表（奶油粉 · 藕紫 · 奶黄 的可爱画风） */
:root{
  --rose:#e46a80; --rose-soft:#fde8ec; --pink:#ffd9e2;
  --orange:#ef9a52; --orange-soft:#fdf0e2;
  --green:#6fbf9a; --green-soft:#e7f6ee;
  --purple:#c9b6e4; --purple-soft:#f2ecfa;
  --cream:#fff6ec; --card:#fffdfb; --card2:#fff8f4;
  --ink:#4a3b42; --ink2:#7d6a72; --ink3:#a8969d;
  --line:#f2e3e6; --warn:#d94862; --warn-soft:#ffeef1;
  --shadow:0 6px 22px rgba(196,142,160,.14);
  --shadow-sm:0 3px 12px rgba(196,142,160,.10);
  --r:22px; --r-sm:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 6%, #ffe6ee 0%, transparent 42%),
    radial-gradient(circle at 88% 4%, #f0e6fb 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, #fff2e0 0%, transparent 55%),
    linear-gradient(170deg,#fffaf6 0%,#fff6f8 55%,#fdf7ff 100%);
  background-attachment:fixed;
  min-height:100vh;
  line-height:1.65;
  font-size:16px;
  overflow-x:hidden;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(46px);opacity:.5;z-index:0;pointer-events:none;
}
body::before{width:240px;height:240px;background:#ffd9e2;top:-70px;left:-80px}
body::after{width:280px;height:280px;background:#e8dbfb;bottom:-110px;right:-90px}

/* 飘落小花 */
.petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:-30px;font-size:15px;opacity:.75;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(0deg)}
  100%{transform:translateY(104vh) rotate(340deg)}
}
@media (prefers-reduced-motion: reduce){.petal{display:none}}

.wrap{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:16px 14px 104px}

/* 顶部标题 */
header.top{display:flex;align-items:center;gap:12px;padding:12px 4px 14px}
.seal{
  width:52px;height:52px;flex:0 0 52px;border-radius:50%;
  background:linear-gradient(145deg,#ffb7c8,#e46a80);
  color:#fff;font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(228,106,128,.36), inset 0 -3px 8px rgba(0,0,0,.08);
  border:2.5px solid #fff;
  animation:beat 3.2s ease-in-out infinite;
}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1)}}
.titles h1{margin:0;font-size:21px;letter-spacing:.5px;font-weight:800;
  background:linear-gradient(100deg,#e46a80,#c07bd6 60%,#ef9a52);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.titles p{margin:2px 0 0;font-size:12.5px;color:var(--ink2);letter-spacing:.3px}

/* 卡片 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;box-shadow:var(--shadow);
}
.card.tight{padding:13px 15px}
.card h2{margin:0 0 10px;font-size:15.5px;display:flex;align-items:center;gap:7px;letter-spacing:.3px}
.card h2 .ic{font-size:17px}
.speech{display:block}

/* 就医警示 */
.alert{
  background:linear-gradient(160deg,#fff2f4,#ffe6ea);
  border:1.5px solid #ffc2ce;border-radius:var(--r);
  margin:12px 0;box-shadow:0 6px 20px rgba(217,72,98,.13);overflow:hidden;
}
.alert summary{
  cursor:pointer;list-style:none;padding:13px 15px;font-weight:700;color:#b8324b;
  font-size:14.5px;display:flex;align-items:center;gap:8px;
}
.alert summary::-webkit-details-marker{display:none}
.alert summary::after{content:"展开";margin-left:auto;font-size:12px;font-weight:600;
  color:#d94862;background:#fff;border-radius:20px;padding:2px 10px;border:1px solid #ffc2ce}
.alert[open] summary::after{content:"收起"}
.alert .body{padding:0 15px 15px}
.alert ul{margin:0;padding-left:19px}
.alert li{margin:6px 0;font-size:13.5px;color:#8a3a4c;line-height:1.6}
.alert .safety{margin:10px 0 0;font-size:12.5px;color:#a4475c;background:#fff;border-radius:12px;padding:9px 11px;line-height:1.55}

/* 阶段徽章 */
.phase{display:flex;align-items:center;gap:12px}
.badge{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:20px;font-size:13.5px;font-weight:700;
  border:1.5px solid currentColor;
}
.badge .dot{font-size:15px}
.cyclebar{height:9px;border-radius:9px;background:#f4e8ec;overflow:hidden;margin:12px 0 4px;display:flex}
.cyclebar i{display:block;height:100%}
.cycledays{display:flex;gap:2px;margin:6px 0 0;flex-wrap:wrap}
.cycledays span{width:100%;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:8px}
.legend b{font-weight:700}

/* 三餐卡片 */
.meal{border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(165deg,var(--card2),#fff);
  margin:11px 0;box-shadow:var(--shadow-sm);overflow:hidden}
.meal>.head{padding:14px 15px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;list-style:none}
.meal>.head::-webkit-details-marker{display:none}
.meal>.head::marker{content:""}
.meal .slot{
  flex:0 0 auto;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--purple-soft);border:1px solid #e6dbf5;
}
.meal .mtitle{flex:1;min-width:0}
.meal .mtitle .nm{display:block;font-size:16px;font-weight:700;letter-spacing:.2px;line-height:1.45}
.meal .mtitle .ds{display:block;font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.6}
.meal .kcal{flex:0 0 auto;font-size:12px;color:var(--rose);font-weight:700;background:var(--rose-soft);
  border-radius:20px;padding:4px 10px;white-space:nowrap}
.meal .arrow{flex:0 0 auto;color:var(--ink3);font-size:12px;margin-left:4px;transition:transform .25s}
.meal[open] .arrow{transform:rotate(180deg)}
.meal .detail{padding:0 15px 15px;border-top:1px dashed var(--line);margin-top:2px}
.meal .detail h4{margin:13px 0 6px;font-size:13px;color:var(--ink2);letter-spacing:.4px;font-weight:700}
.meal .detail ul{margin:0;padding-left:18px}
.meal .detail li{font-size:13.5px;margin:4px 0;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--green-soft);color:#3f8a6c;border:1px solid #cfeade;font-weight:600}
.tag.iron{background:#fde8ec;color:#c2415c;border-color:#f8cbd6}
.tag.warm{background:#fdf0e2;color:#b8742e;border-color:#f6ddbe}
.tag.pro{background:#eef4ff;color:#4a6fbf;border-color:#d6e3fb}
.tag.mg{background:#f2ecfa;color:#7a5cc0;border-color:#e0d3f5}
.tipbox{margin-top:11px;font-size:12.5px;color:#7a5c46;background:var(--cream);border-radius:12px;padding:9px 11px;line-height:1.6;border:1px dashed #f0ddc8}
.sub{margin-top:9px;font-size:12.5px;color:#5d7a6c;background:var(--green-soft);border-radius:12px;padding:9px 11px;line-height:1.6}

/* 小豆吉祥物 */
.beanrow{display:flex;gap:11px;align-items:center}
.beanrow svg{flex:0 0 auto}
.speech{
  position:relative;background:linear-gradient(160deg,#fff5f8,#fff);border:1.5px solid #ffdce6;
  border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.7;flex:1;
}
.speech::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:#fff5f8;
  border-left:1.5px solid #ffdce6;border-bottom:1.5px solid #ffdce6;transform:rotate(45deg)}
.speech .who{font-size:11.5px;color:var(--rose);font-weight:700;display:block;margin-bottom:4px}

/* 注意事项 */
.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.65}
.notes li:last-child{border-bottom:none}
.notes li .b{flex:0 0 auto;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--purple-soft);color:#6b52a8;border:1px solid #e3d7f7}

/* 热量 */
.kcalrow{display:flex;gap:10px;margin-top:6px}
.kcalbox{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;text-align:center}
.kcalbox .v{font-size:19px;font-weight:800;color:var(--rose)}
.kcalbox .l{font-size:11.5px;color:var(--ink2);margin-top:2px}
.bar{height:10px;border-radius:10px;background:#f4e8ec;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;transition:width .5s}
.advice{margin-top:11px;font-size:13px;color:#5d6b7a;background:#f2f6ff;border-radius:12px;padding:10px 12px;line-height:1.65;border:1px dashed #d8e3f7}

/* 按钮 */
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button,.btn{
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  border-radius:16px;padding:11px 16px;border:1.5px solid transparent;
  transition:transform .12s ease, box-shadow .2s ease;
}
button:active,.btn:active{transform:scale(.94)}
.btn-main{background:linear-gradient(120deg,#f0879e,#e46a80);color:#fff;box-shadow:0 6px 16px rgba(228,106,128,.34)}
.btn-2{background:linear-gradient(120deg,#f5b477,#ef9a52);color:#fff;box-shadow:0 6px 16px rgba(239,154,82,.3)}
.btn-3{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn-ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn-auto{margin-top:9px}

/* 底部导航 */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;gap:6px;
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,252,250,.92);backdrop-filter:blur(14px);
  border-top:1px solid #f6e6ea;
}
nav.tabs button{
  flex:1;max-width:150px;background:transparent;border:none;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;padding:6px 4px;
}
nav.tabs button .i{font-size:19px}
nav.tabs button.on{color:var(--rose)}
nav.tabs button.on .i{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* 表单 */
label.f{display:block;margin:13px 0 5px;font-size:13.5px;font-weight:700;color:var(--ink)}
label.f span{font-weight:500;color:var(--ink3);font-size:12px}
input[type=text],input[type=number],input[type=date],select{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
}
input:focus,select:focus{outline:none;border-color:#f2b7c6;box-shadow:0 0 0 4px #fdeef2}
.hint{font-size:12px;color:var(--ink3);margin-top:5px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.prefs{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.prefs label{
  display:inline-flex;align-items:center;gap:5px;font-size:12.5px;
  background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--ink2);
}
.prefs input{margin:0;accent-color:var(--rose)}
.prefs label.sel{background:var(--rose-soft);border-color:#f6c6d2;color:#b93c58}

/* 引导弹层 */
.mask{position:fixed;inset:0;z-index:40;background:rgba(74,59,66,.42);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.mask{align-items:center}}
.sheet{
  background:linear-gradient(175deg,#fffdfb,#fff7f9);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;
  border-radius:26px 26px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(150,100,120,.22);animation:rise .34s cubic-bezier(.2,.9,.3,1.1);
}
@media(min-width:640px){.sheet{border-radius:26px;max-height:88vh}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:19px}
.sheet .lead{font-size:13.5px;color:var(--ink2);margin:0 0 6px;line-height:1.7}
.stepdots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.stepdots i{width:7px;height:7px;border-radius:50%;background:#f0dfe4}
.stepdots i.on{background:var(--rose);width:20px;border-radius:6px}

/* 参考来源 */
.src{display:flex;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.6}
.src:last-child{border-bottom:none}
.src .n{color:var(--ink3);font-weight:700;flex:0 0 auto}
.src a{color:#b9546e;text-decoration:none;word-break:break-all}
.src a:hover{text-decoration:underline}

.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(14px);
  background:rgba(74,59,66,.94);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:20px;
  z-index:60;opacity:0;transition:all .3s;pointer-events:none;max-width:88vw;text-align:center;line-height:1.5
}
.toast.on{opacity:1;transform:translateX(-50%)}
.sec{display:none}
.sec.on{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mini{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:8px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv b{font-weight:700;color:var(--rose)}
.footer{text-align:center;font-size:11.5px;color:var(--ink3);padding:22px 6px 6px;line-height:1.7}
@media (max-width:360px){
  body{font-size:15px}
  .wrap{padding-left:11px;padding-right:11px}
  .meal .mtitle .nm{font-size:15px}
}

/* 校园模块 */
.hall{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.hall:last-of-type{border-bottom:none}
.hall .mk{flex:0 0 auto;font-size:18px;line-height:1.4}
.hall .tx{flex:1;min-width:0}
.hall .nm{font-weight:700;font-size:14px}
.hall .wh{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.55}
.hall .us{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.6}
.hall.mine{background:var(--rose-soft);border-radius:14px;padding:11px 12px;border-bottom:none;margin:6px 0}
.formula{font-size:13.5px;font-weight:700;color:#6b52a8;background:var(--purple-soft);border-radius:12px;padding:10px 12px;margin:9px 0;line-height:1.65;border:1px dashed #e0d3f5}
.pickrow{font-size:13px;color:#3f8a6c;background:var(--green-soft);border-radius:12px;padding:10px 12px;line-height:1.75;margin-top:8px}
.avoidrow{font-size:13px;color:#a8701f;background:var(--orange-soft);border-radius:12px;padding:10px 12px;line-height:1.75;margin-top:8px}
.campusnote{font-size:13px;color:#b93c58;background:var(--rose-soft);border-radius:12px;padding:10px 12px;line-height:1.7;border:1px dashed #f6c6d2;margin-top:9px}
nav.tabs button .i{font-size:18px}
@media (max-width:380px){nav.tabs button{font-size:10.5px}}

</style>
</head>
<body>
<div id="root">

吃效果最好，具体请遵医嘱或咨询药师。","睡眠比运动重要。这几天散步或做温和瑜伽就够了，别做高强度训练。","如果疼到冒冷汗、眼前发黑，立刻坐下或躺下并把腿抬高，同时让身边的人陪着。"],"premenstrual":["经前会特别想吃甜的，先把蛋白质和蔬菜吃够，那个念头会弱很多。","控盐能减少水肿：腌制品、麻辣烫、重口味外卖这几天少一点。","补镁对情绪和肌肉抽筋都有帮助：坚果、南瓜籽、深绿色蔬菜、香蕉。","别在这几天突然大幅节食，容易情绪崩，也容易反弹。","提前把热水袋、暖贴和止痛药准备好，别等到疼起来才找。","每天走 20–30 分钟，经前那种闷闷沉沉的感觉得会明显轻一些。"],"normal":["这个阶段是减脂的主要窗口期，缺口控制在每天 300 kcal 左右就好。","蛋白质每天吃够体重（公斤）× 1.2 克，减脂时才不容易掉肌肉。","主食粗细搭配，糙米、燕麦、红薯换着来。","每天蔬菜 300–500 克、水果 200–350 克，颜色越杂越好。","每周 3 次力量训练加 2 次中等强度有氧，是对减脂最友好的组合。","睡够 7 小时。睡不好的第二天，会格外想吃高热量食物。"],"general":["三餐尽量吃热的，胃暖了，整个人都会松一点。","每天喝够 1500–1700 毫升水，温开水最好。","长期严重痛经要去妇科看一次，不要一直靠止痛药撑。","记准自己的经期日期，这份食谱才会越来越贴合你。","这份食谱是生活建议，不能替代医生的诊断和治疗。"]},"weightNotes":["每天大约 300 kcal 的温和缺口，全天热量不低于 1200 kcal。","经前 3 天和整个经期不留缺口，身体舒服优先于一切。","每周固定一天称一次体重就好，不用每天称。","体重没掉但腰围变小、裤腰变松，那也是在变好。","不要用断食换体重。痛经已经很辛苦了，别再让身体饿着。"],"redFlags":["痛经到晕倒、意识模糊、眼前发黑 —— 这是要尽快去妇科排查的信号。","痛经一年比一年重，或者疼的时间越来越长。","止痛药吃了完全没用，或者需要越吃越多。","经量突然明显增多，比如一两个小时就要换一次卫生巾。","经期以外也有出血，或者性交、排便、排尿时疼痛。","痛经同时发烧、恶心呕吐、腹泻到脱水。","备孕一年以上没有怀上，同时一直有痛经。","疼痛持续整个月不缓解，或这次是第一次这么严重。"],"encouragements":["小豆，今天不用很厉害，只要吃上热乎的三餐就已经很棒了。","欣怡，肚子疼的时候允许自己什么都不做，这不是偷懒。","童欣怡，你今天的每一口热饭，都是在好好照顾自己。","小豆，慢一点没关系，我们本来就说好了要慢慢来。","欣怡，难受是真的，但它会过去，我一直在这儿。","小豆，你今天能打开这个页面，就说明你没有放弃自己。","童欣怡，红豆期第三天最难熬，你已经撐过一大半了。","欣怡，不想吃饭就喝碗热粥，喝下去也算数。","小豆，别跟自己生气，身体只是需要一点耐心。","欣怡，今天多喝一口温水，我就当你答应我了。","小豆，你不是矫情，痛经真的可以很疼，这我知道。","童欣怡，这周先不管体重，我们先把疼痛放下去。","欣怡，你要相信，身体是站在你这边的。","小豆，今天早睡半小时，明天你会感谢现在的自己。","欣怡，一口一口，一天一天，我们这样慢慢来。","小豆，难过的时候吃点热的，热的东西有安抚的力量。","童欣怡，你的身体已经替你辛苦很久了，对它温柔一点。","欣怡，今天的你值得被好好对待，包括被你自己。","小豆，不管今天多糟，明天还有一碗热粥等着你。","欣怡，别急着变好，先把今天过舒服。","小豆，喝水、暖肚子、早点睡，就这三件事，今天做到就够了。","童欣怡，痛的时候记得呼吸，慢慢吸气，再慢慢吐出来。","欣怡，你做得比你以为的好得多。","小豆，今天也能吃到好吃的，只是换成了更照顾你的那种。","欣怡，如果实在难受，就给我说，别一个人扛。","小豆，那几天过去之后，你会重新变得很有力气。","童欣怡，你今天已经很努力地在生活了。","欣怡，好好吃饭这件事，本身就是一种爱自己。","小豆，慢慢嚼，慢慢吃，不用赶时间。","欣怡，今天你只需要对自己温柔一点，别的都可以明天再说。","小豆，经前的烦躁不是你的错，是激素在捣乱。","童欣怡，体重不是评价你的标准，你本来就已经很好。","欣怡，热敷二十分钟，别嫌麻烦，你值得这二十分钟。","小豆，如果今天只做成了一件事，那就好好吃了顿饭。","欣怡，你的坚持我都看见了，虽然你什么都没说。","小豆，今天也允许自己躺一会儿，躺着也是休息，不是浪费。","童欣怡，谢谢你今天还愿意照顾自己。","欣怡，一口热汤   else { out.phase='normal'; }
  return out;
}
function periodStartAfter(dateKeyStr){
  var L=Math.max(21,Math.min(35,+S.cycle.cycleLength||28));
  var diff=dayDiff(S.cycle.lastPeriodStart,dateKeyStr);
  var k=Math.floor(diff/L); if(k<0) k=0;
  var cand=addDays(S.cycle.lastPeriodStart,k*L);
  if(dayDiff(cand,dateKeyStr)>0) cand=addDays(cand,L);
  return cand;
}
function banned(dish){
  var bans=S.dietPrefs.bans||[];
  if(!bans.length) return false;
  var x=dish.x||[];
  for(var i=0;i<bans.length;i++){
    var b=bans[i];
    if(b==='__vegan'){
      for(var j=0;j<MEAT_TAGS.length;j++){ if(x.indexOf(MEAT_TAGS[j])>=0) return true; }
      if(x.indexOf('乳')>=0||x.indexOf('蛋')>=0) return true;
      continue;
    }
    if(b==='__veg'){
      for(var m=0;m<MEAT_TAGS.length;m++){ if(x.indexOf(MEAT_TAGS[m])>=0) return true; }
      continue;
    }
    if(x.indexOf(b)>=0) return true;
  }
  return false;
}
function conflicted(dish){
  var lab={}; CONTRA.forEach(function(c){ lab[c.k]=c.label; });
  return (dish.x||[]).filter(function(t){ return t!=='__vegan'&&t!=='__veg'; })
    .map(function(t){ return lab[t]||t; }).join('、');
}
function phaseTag(p){ return p==='period'?'经':(p==='premenstrual'?'前':'常'); }
function pickDish(slot,day,pool){
  var n=pool.length; if(!n) return null;
  var perm=seededOrder(n,hashStr('dxwl-'+slot));
  var base=day+SLOT_OFF[slot];
  for(var k=0;k<n;k++){
    var d=pool[perm[((base+k)%n+n)%n]];
    if(!banned(d)) return d;
  }
  return pool[perm[((base%n)+n)%n]];
}
function pickDrink(day,phase){
  var pool=(DB.drinks||[]).filter(function(x){ return x.t.indexOf(phaseTag(phase))>=0; });
  if(!pool.length) return null;
  var n=pool.length; var perm=seededOrder(n,hashStr('dxwl-drink-'+phase));
  var base=day+SLOT_OFF.drink;
  for(var k=0;k<n;k++){
    var d=pool[perm[((base+k)%n+n)%n]];
    if(!banned(d)) return d;
  }
  return pool[0];
}
function bmr(p){ return 10*p.weightKg + 6.25*p.heightCm - 5*p.age - 161; }
function tdee(p){ return bmr(p)*(+p.activityFactor||1.3); }
function calTarget(ph){
  var p=S.profile;
  if(p.calorieOverride) return +p.calorieOverride;
  if(!p.heightCm||!p.weightKg) return 1600;
  var t=tdee(p);
  var comfort = (ph.phase==='period') || (ph.phase==='premenstrual' && ph.cycleDay>=ph.L-2);
  return Math.max(1200, Math.round(comfort ? t : t-300));
}
function buildDay(dateKeyStr){
  var day=dayNum(dateKeyStr);
  var ph=phaseFor(dateKeyStr);
  var meals=[];
  ['breakfast','lunch','dinner'].forEach(function(slot){
    var d=pickDish(slot,day,DB.recipes[slot]);
    if(d) meals.push({slot:slot,dish:d});
  });
  if(+S.profile.meals===4){
    var sn=pickDish('snack',day,DB.recipes.snack);
    if(sn) meals.push({slot:'snack',dish:sn});
  }
  var drink=pickDrink(day,ph.phase);
  var total=meals.reduce(function(a,m){ return a+m.dish.k; },0)+(drink?drink.k:0);
  var pn=DB.copy.notes[ph.phase]; var gn=DB.copy.notes.general;
  var notes=[0,1,2].map(function(i){ return pn[(day+i)%pn.length]; }).concat([gn[day%gn.length]]);
  return { date:dateKeyStr, ph:ph, meals:meals, drink:drink, total:total, notes:notes,
    encourage:DB.copy.encouragements[day%DB.copy.encouragements.length], target:calTarget(ph) };
}

function icsEscape(s){
  return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function fold(line){
  var bytes=0,out='',buf='';
  for(var i=0;i<line.length;i++){
    var ch=line.charAt(i);
    var len=encodeURIComponent(ch).replace(/%../g,'x').length;
    if(bytes+len>68){ out+=(out?'\r\n ':'')+buf; buf=''; bytes=0; }
    buf+=ch; bytes+=len;
  }
  if(buf) out+=(out?'\r\n ':'')+buf;
  return out;
}
function dlStamp(){
  var d=new Date();
  return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+'T'+pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+pad2(d.getUTCSeconds())+'Z';
}
function buildICS(){
  var L=Math.max(21,Math.min(35,+S.cycle.cycleLength||28));
  var P=Math.max(3,Math.min(9,+S.cycle.periodLength||5));
  var t0=todayKey();
  var start=periodStartAfter(t0);
  var ev=[];
  for(var c=0;c<3;c++){
    var ps=addDays(start,c*L);
    for(var i=3;i>=1;i--){
      var dt=addDays(ps,-i);
      if(dayDiff(t0,dt)<0) continue;
      ev.push({d:dt,t:'经前准备 · 还有 '+i+' 天到红豆期',
        x:'小豆暖食光提醒：距离经期还有 '+i+' 天。今天开始控盐、补镁（坚果、南瓜籽、香蕉），把暖贴和止痛药提前备好，早点睡。'});
    }
    for(var j=0;j<P;j++){
      var dt2=addDays(ps,j);
      if(dayDiff(t0,dt2)<0) continue;
      var isFirst=(j===0);
      ev.push({d:dt2,
        t:(isFirst?'姨妈来了 · 红豆期第 1 天':'红豆期第 '+(j+1)+' 天 · 小豆暖食光'),
        x:(isFirst
          ?'小豆暖食光提醒：今天是红豆期第 1 天，热量不设缺口。喝温热的红糖姜枣茶，用热水袋敷小腹 15–20 分钟；疼的时候请遵医嘱尽早吃止痛药。'
          :'小豆暖食光提醒：红豆期第 '+(j+1)+' 天。今天吃温热的餐食，避开生冷和咖啡因，别做高强度运动，累了就躺着。')});
    }
  }
  var lines=[];
  lines.push('BEGIN:VCALENDAR');
  lines.push('VERSION:2.0');
  lines.push('PRODID:-//xiaodou nuanshiguang//CN');
  lines.push('CALSCALE:GREGORIAN');
  lines.push('METHOD:PUBLISH');
  lines.push('X-WR-CALNAME:小豆暖食光 · 经期提醒');
  lines.push('X-WR-TIMEZONE:Asia/Shanghai');
  lines.push('BEGIN:VTIMEZONE');
  lines.push('TZID:Asia/Shanghai');
  lines.push('BEGIN:STANDARD');
  lines.push('DTSTART:19700101T000000');
  lines.push('TZOFFSETFROM:+0800');
  lines.push('TZOFFSETTO:+0800');
  lines.push('TZNAME:CST');
  lines.push('END:STANDARD');
  lines.push('END:VTIMEZONE');
  var stamp=dlStamp();
  ev.forEach(function(e,i){
    var dk=e.d.replace(/-/g,'');
    lines.push('BEGIN:VEVENT');
    lines.push('UID:dxwl-'+dk+'-'+i+'@xiaodou-nuanshiguang');
    lines.push('DTSTAMP:'+stamp);
    lines.push('DTSTART;TZID=Asia/Shanghai:'+dk+'T080000');
    lines.push('DTEND;TZID=Asia/Shanghai:'+dk+'T081500');
    lines.push('SUMMARY:'+icsEscape(e.t));
    lines.push('DESCRIPTION:'+icsEscape(e.x));
    lines.push('TRANSP:TRANSPARENT');
    lines.push('BEGIN:VALARM');
    lines.push('TRIGGER:PT0M');
    lines.push('ACTION:DISPLAY');
    lines.push('DESCRIPTION:'+icsEscape(e.t));
    lines.push('END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(fold).join('\r\n')+'\r\n';
}
function downloadICS(){
  var text=buildICS();
  var blob=new Blob([text],{type:'text/calendar;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='小豆暖食光_经期提醒.ics';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}

  } else if(OBI.step===1){
    h='<div class="sheet">'+
      '<h2>先告诉我经期的事 🌙</h2>'+
      '<p class="lead">不知道准确日期也没关系，先按你记得的那天填，之后点「姨妈来了」就会自动校准。</p>'+
      '<label class="f">上次月经开始的那天</label><input type="date" id="obLast" value="'+esc(OBI.last)+'">'+
      '<div class="hint">默认是 2026-10-01（国庆那天），记不清就先留着。</div>'+
      '<div class="grid2" style="margin-top:12px">'+
        '<div><label class="f">周期天数 <span>21–35</span></label><input type="number" id="obLen" value="'+OBI.len+'" min="21" max="35"></div>'+
        '<div><label class="f">经期天数 <span>3–9</span></label><input type="number" id="obPer" value="'+OBI.per+'" min="3" max="9"></div>'+
      '</div>'+
      '<div class="stepdots"><i></i><i></i></div>'+
      '<div class="btnrow"><button class="btn-3" id="obPrev">上一步</button><button class="btn-main" style="flex:1" id="obNext2">下一步 ➜</button></div>'+
    '</div>';
  } else {
    h='<div class="sheet">'+
      '<h2>最后几个小问题 ✨</h2>'+
      '<p class="lead">填了之后热量会算得更准。所有数据只存在你这台设备里，不会上传。</p>'+
      '<label class="f">你的称呼</label><input type="text" id="obNick" value="'+esc(nick)+'" placeholder="小豆">'+
      '<div class="grid2" style="margin-top:12px">'+
        '<div><label class="f">身高 <span>cm</span></label><input type="number" id="obH" placeholder="选填"></div>'+
        '<div><label class="f">体重 <span>kg</span></label><input type="number" id="obW" placeholder="选填"></div>'+
      '</div>'+
      '<div class="hint">不想填就留空，会用 1600 kcal 的通用目标，一样能用。</div>'+
      '<label class="f">有什么不吃的吗 <span>可多选，不选就是什么都吃</span></label>'+
      '<div class="prefs" id="obPrefs">'+CONTRA.map(function(o){ return '<label><input type="checkbox" value="'+o.k+'">'+esc(o.label)+'</label>'; }).join('')+'</div>'+
      '<div class="stepdots"><i></i><i></i></div>'+
      '<div class="btnrow"><button class="btn-3" id="obPrev2">上一步</button><button class="btn-main" style="flex:1" id="obDone">完成，带我去看今天的食谱 🍚</button></div>'+
    '</div>';
  }
  host.innerHTML=h;
  var b;
  if((b=document.getElementById('obNext'))) b.onclick=function(){ OBI.step=1; drawOB(); };
  if((b=document.getElementById('obSkip'))) b.onclick=function(){ finishOB(true); };
  if((b=document.getElementById('obPrev'))) b.onclick=function(){ OBI.step=0; drawOB(); };
  if((b=document.getElementById('obNext2'))) b.onclick=function(){
    OBI.last=document.getElementById('obLast').value||OBI.last;
    OBI.len=Math.max(21,Math.min(35,+document.getElementById('obLen').value||28));
    OBI.per=Math.max(3,Math.min(9,+document.getElementById('obPer').value||5));
    OBI.step=2; drawOB();
  };
  if((b=document.getElementById('obPrev2'))) b.onclick=function(){ OBI.step=1; drawOB(); };
  if((b=document.getElementById('obDone'))) b.onclick=function(){
    S.cycle.lastPeriodStart=OBI.last; S.cycle.cycleLength=OBI.len; S.cycle.periodLength=OBI.per;
    S.profile.nickname=document.getElementById('obNick').value||'小豆';
    S.profile.heightCm=+document.getElementById('obH').value||null;
    S.profile.weightKg=+document.getElementById('obW').value||null;
    var bans=[];
    Array.prototype.forEach.call(document.querySelectorAll('#obPrefs input:checked'),function(i){ bans.push(i.value); });
    S.dietPrefs.bans=bans;
    finishOB(false);
  };
  Array.prototype.forEach.call(document.querySelectorAll('#obPrefs label'),function(l){
    var cb=l.querySelector('input');
    cb.addEventListener('change',function(){ l.classList.toggle('sel', cb.checked); });
  });
}
function finishOB(skipped){
  S.ui.onboarded=true; persist(); closeOB(); render();
  toast(skipped?'已用默认设置，随时可以在「设置」里改 💗':'设置好啦，今天也要好好吃饭 💗');
}

function boot(){
  document.getElementById('root').innerHTML=shell();
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){
    b.onclick=function(){
      VIEW=b.getAttribute('data-view'); render();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  render();
  if(!S.ui.onboarded) onboarding();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) render(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();

</script>
</body>
</html>
